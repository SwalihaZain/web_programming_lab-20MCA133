<!DOCTYPE html>
<html>
<head>
  <title>CSS Example</title>
  <style>
    .internal-style {
      color: blue;
      font-size: 20px;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="external-style">This is styled with external CSS</h1>
  <p class="internal-style">This is styled with internal CSS</p>
  <p style="color: red; font-size: 16px;">This is styled with inline CSS</p>
</body>
</html>
