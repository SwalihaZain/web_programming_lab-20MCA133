<!DOCTYPE html>
<html>
<head>
  <title>Predefined Functions in String and Math</title>
</head>
<body>
  <script>
    document.write("<h2>Predefined Functions in String and Math Object</h2>");

    var num = Math.round(4.4);
    document.write("Rounding a number using Math.round: " + num);

    var str = "Hello world";
    document.write("<br>");
    document.write("Character at 0th position of \"" + str + "\" is: " + str.charAt(0));

    var c = 50.65;
    var x = Math.ceil(c);
    document.write("<br>Value of " + c + " after using Math.ceil is: " + x);

    var w = "web programming";
    var z = w.toUpperCase();
    document.write("<br>Web programming to uppercase: " + z);
  </script>
</body>
</html>
